dependencies = ["# For Janus", "git+https://github.com/deepseek-ai/Janus.git", "# For TBG", "opencv-python", "matplotlib", "piexif", "ollama", "color-matcher", "grog", "opencv-contrib-python", "color-matcher", "# For Qwen 2.5 VL:", "hf_xet", "pillow", "qwen-vl-utils", "bitsandbytes", "optimum", "# Correction for Nunchacu", "huggingface_hub>=0.34", "transformers==4.56.2", "diffusers>=0.35.0", "accelerate>=1.10"]

