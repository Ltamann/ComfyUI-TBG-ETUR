<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TBG Magnific Magnifier PRO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>TBG Magnific Magnifier PRO</h1>

  <!-- The form will be generated by script.js – we only need a container -->
  <form id="node-form"></form>

  <!-- Buttons -->
  <div class="btn-bar">
    <button id="run-btn" type="button">Run</button>
    <button id="reset-btn" type="reset">Reset</button>
  </div>

  <!-- Execution log -->
  <pre id="log"></pre>

  <!-- Result images -->
  <div id="results" class="grid"></div>

  <script src="script.js"></script>
</body>
</html>
